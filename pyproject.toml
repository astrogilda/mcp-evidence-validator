[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-evidence-validator"
version = "0.4.0"
description = "Validate what an MCP server declares against what it actually does, with a tamper-evident SHA-256 evidence ledger."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Empire Labs Pty Ltd", email = "contact@empirelabs.com.au" }]
keywords = ["mcp", "model-context-protocol", "evidence", "audit", "observability", "agentic-ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/narko4u/mcp-evidence-validator"
Source = "https://github.com/narko4u/mcp-evidence-validator"
Documentation = "https://github.com/narko4u/mcp-evidence-validator/tree/main/docs"
Issues = "https://github.com/narko4u/mcp-evidence-validator/issues"

[project.scripts]
mcp-ev-validate = "mcp_evidence_validator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101"]  # asserts are fine in tests
